<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Excello">
<meta name="description" content="İnternetsiz çalışan, formül yazdırmayan tablo uygulaması — klasik (Excel benzeri) görünüm">
<title>Excello</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="stylesheet" href="css/klasik.css">
</head>
<body>
<div id="app">
  <header class="topbar">
    <button id="btnMenu" class="ic" aria-label="Dosya menüsü" data-icon="menu"></button>
    <span class="logo">E</span>
    <div class="doc">
      <input id="docName" aria-label="Çalışma adı" spellcheck="false" autocomplete="off">
      <span id="saveState">Kaydedildi</span>
    </div>
    <div class="spacer"></div>
    <button id="btnUndo" class="ic" aria-label="Geri al" title="Geri al (Ctrl+Z)" data-icon="undo" disabled></button>
    <button id="btnRedo" class="ic" aria-label="Yinele" title="Yinele (Ctrl+Y)" data-icon="redo" disabled></button>
    <button id="btnSave" class="btn primary" title="Kaydet (Ctrl+S)" data-icon="save"><span class="hide-sm">Kaydet</span></button>
  </header>
  <nav id="tabs" class="tabs"></nav>
  <div id="ribbon" class="ribbon"></div>
  <div id="fbar" class="fbar">
    <button id="nameBox" class="namebox" title="Hücreye git">A1</button>
    <button id="btnRecipes" class="fbtn wand" title="Hazır Hesaplar" data-icon="wand"><span class="hide-sm">Hazır Hesap</span></button>
    <button id="btnFx" class="fbtn" title="İşlev sihirbazı"><span class="fx">fx</span></button>
    <input id="fInput" class="finput" spellcheck="false" autocomplete="off" autocapitalize="off" placeholder="Değer yazın ya da Hazır Hesap kullanın">
    <button id="fCancel" class="ic sm fe" aria-label="Vazgeç" data-icon="x"></button>
    <button id="fOk" class="ic sm fe ok" aria-label="Onayla" data-icon="check"></button>
  </div>
  <main id="gridWrap" class="gridwrap">
    <canvas id="cv"></canvas>
    <div id="scroller" class="scroller"><div id="spacer" class="spacer-el"></div></div>
    <textarea id="editor" class="editor" spellcheck="false" autocomplete="off" autocapitalize="off"></textarea>
  </main>
  <div id="pickbar" class="pickbar">
    <div class="pk-txt"><small id="pickLabel">Hücreleri seçin</small><b id="pickRef">—</b></div>
    <button id="pickCancel" class="btn">Vazgeç</button>
    <button id="pickOk" class="btn primary" data-icon="check">Tamam</button>
  </div>
  <footer class="footbar">
    <div id="sheetTabs" class="sheettabs"></div>
    <button id="btnAddSheet" class="ic sm" aria-label="Sayfa ekle" title="Sayfa ekle" data-icon="plus"></button>
    <div class="spacer"></div>
    <div id="stats" class="stats"></div>
  </footer>
</div>
<script src="js/formula.js"></script>
<script src="js/model.js"></script>
<script src="js/ui.js"></script>
<script src="js/chart.js"></script>
<script src="js/io.js"></script>
<script src="js/grid.js"></script>
<script src="js/wizard.js"></script>
<script src="js/app.js"></script>
<script>document.querySelectorAll('[data-icon]').forEach(function (e) { e.insertAdjacentHTML('afterbegin', UI.icon(e.dataset.icon)); });</script>
</body>
</html>
